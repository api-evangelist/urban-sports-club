aid: urban-sports-club
name: Urban Sports Club
description: 'Urban Sports Club is a Berlin-based sports and wellness membership platform.
  One flexible subscription gives members access to more than 50 sports and wellness
  activities across thousands of partner venues in Europe, plus online classes, and
  employers can offer it as a corporate fitness benefit. The company publishes no
  public developer API; partner studios and gyms connect through third-party booking-software
  integrations such as Eversports, Magicline, bsport, Virtuagym, and Mindbody. A
  Partech portfolio company.'
